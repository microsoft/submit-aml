name: Docs Preview Comment

# Runs in the context of the base repository (with write permissions) after
# the "Docs" workflow finishes, so that docs previews built from fork pull
# requests can still be published and commented on. See:
# https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
on:
  workflow_run:
    workflows: [Docs]
    types: [completed]

env:
  FORCE_COLOR: 1

permissions:
  pull-requests: write

jobs:
  comment:
    name: Deploy preview and comment on PR
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Download docs preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata
        id: pr
        run: |
          echo "number=$(cat pr_number.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat pr_head_sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Deploy preview with Smokeshow
        run: |
          uvx smokeshow upload site/ 2>&1 | tee smokeshow-output.txt
          url=$(grep -oP 'https://smokeshow\.helpmanual\.io/[^\s"]+' smokeshow-output.txt | head -1)
          echo "SMOKESHOW_URL=$url" >> "$GITHUB_ENV"
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Docs preview
          SMOKESHOW_GITHUB_CONTEXT: docs-preview
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ steps.pr.outputs.sha }}

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docs-preview
          number: ${{ steps.pr.outputs.number }}
          message: |
            📖 **Docs preview**: ${{ env.SMOKESHOW_URL }}
